name: Build test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "/LJT-Homepage/"
        env:
          JEKYLL_ENV: production
      - name: Inspect generated site
        run: |
          echo "=== _site root ==="
          ls _site
          echo "=== publication pages ==="
          ls _site/publication
          echo "=== about page (text extract) ==="
          python3 - <<'PY'
          import re, html
          t = open('_site/index.html', encoding='utf-8').read()
          t = re.sub(r'<script.*?</script>', ' ', t, flags=re.S)
          t = re.sub(r'<style.*?</style>', ' ', t, flags=re.S)
          t = re.sub(r'<[^>]+>', '\n', t)
          t = html.unescape(t)
          lines = [l.strip() for l in t.splitlines() if l.strip()]
          print('\n'.join(lines))
          PY